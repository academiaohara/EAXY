<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1024" />
  <title>Multiplicar es repetir grupos — diapositiva Eaxy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <style>
    :root {
      --stage-surface: #1a2332;
      --stage-ink: #ffffff;
      --stage-muted: #b8c2d0;
      --stage-border: #3d4f66;
      --stage-accent: #58c4dd;
      --cobalt: #4353ff;
      --amber: #ffd866;
      --amber-bg: rgba(255, 193, 7, 0.22);
      --teal: #5eead4;
      --teal-bg: rgba(45, 212, 191, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      min-width: 768px;
      background: #0f1419;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    }

    .frame {
      position: relative;
      width: min(1100px, 100%);
      height: min(720px, calc(100vh - 48px));
      background: var(--stage-surface);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 24px 16px;
      z-index: 10;
    }

    .title {
      font-size: 1.875rem;
      font-weight: 700;
      line-height: 1.2;
      color: var(--stage-ink);
      letter-spacing: 0;
      max-width: 42rem;
      border-left: 5px solid var(--teal);
      padding-left: 14px;
    }

    .title-accent {
      color: var(--teal);
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--stage-border);
      background: rgba(18, 26, 38, 0.85);
      color: #fbbf24;
      font-size: 0.875rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .score svg { width: 16px; height: 16px; flex-shrink: 0; }

    .content {
      flex: 1;
      min-height: 0;
      padding: 8px 24px 88px;
      padding-right: calc(24px + 56px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .definition {
      border: 2px solid color-mix(in srgb, var(--stage-accent) 35%, transparent);
      background: color-mix(in srgb, var(--stage-accent) 12%, transparent);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 1.125rem;
      font-weight: 400;
      line-height: 1.8;
      color: var(--stage-ink);
    }

    .definition mark {
      background: var(--amber-bg);
      color: var(--amber);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .definition mark.suma {
      background: var(--teal-bg);
      color: var(--teal);
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      min-height: 12rem;
    }

    .tickets-row {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 2.5rem;
    }

    .ticket-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      min-width: 7.5rem;
    }

    .ticket-area {
      position: relative;
      height: 6.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }

    .ticket-area.single {
      width: 6rem;
    }

    .ticket-area.fan {
      width: 160px;
    }

    .ticket {
      width: 6rem;
      height: 5rem;
      object-fit: contain;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35));
      position: absolute;
      bottom: 0;
      left: 0;
      transform: rotate(-14deg);
    }

    .ticket.fan-1 { left: 0px; z-index: 1; }
    .ticket.fan-2 { left: 16px; z-index: 2; }
    .ticket.fan-3 { left: 32px; z-index: 3; }
    .ticket.fan-4 { left: 48px; z-index: 4; }
    .ticket.fan-5 { left: 64px; z-index: 5; }

    .badge {
      font-family: "IBM Plex Mono", monospace;
      font-size: 1rem;
      font-weight: 700;
      color: #1a2332;
      background: #fff;
      border: 2px solid rgba(56, 189, 248, 0.9);
      border-radius: 6px;
      padding: 4px 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
      min-height: 2rem;
      min-width: 3.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .badge.empty {
      color: transparent;
      user-select: none;
    }

    .caption {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--stage-muted);
    }

    .equation {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--stage-ink);
    }

    .equation .katex { font-size: 1.05em; }

    /* Sidebar dots */
    .slides-sidebar {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 20;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.5);
      box-shadow: 0 0 0 1px rgba(100, 116, 139, 0.45);
    }

    .dot.current {
      background: var(--cobalt);
      box-shadow: 0 0 0 3px rgba(67, 83, 255, 0.38);
    }

    /* Presenter rail */
    .presenter-rail {
      position: absolute;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 30;
    }

    .circle-btn {
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid var(--stage-border);
      background: rgba(26, 35, 50, 0.9);
      color: var(--stage-muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      cursor: default;
    }

    .circle-btn svg { width: 20px; height: 20px; }

    /* Tutor dock */
    .tutor-dock {
      position: absolute;
      left: 20px;
      bottom: 16px;
      z-index: 25;
      width: 76px;
      height: 76px;
    }

    .tutor-dock img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.35));
    }

    .tutor-eyes {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
